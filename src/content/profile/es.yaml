name: Mario Vizcaino
headline: Software simple, seguro y escalable — construido rápido con IA.
role: Full Stack & AI Engineer · Tech Leader
location: Barranquilla, Colombia
bio: >-
  Soy Full Stack & AI Engineer y Tech Leader con más de diez años construyendo software.
  Diseño sistemas cloud-native en Google Cloud con Docker y Kubernetes, conecto plataformas
  mediante integraciones de APIs seguras y pipelines de datos, y construyo soluciones con IA —
  LLMs, extracción de datos de documentos y automatización de procesos. También uso desarrollo
  asistido por IA para entregar más rápido sin sacrificar calidad, y lidero equipos de
  desarrollo en auditorías ISO 27001. Me gusta el software simple, seguro por defecto y rápido
  de entregar.
availability: Abierto a nuevas conversaciones
services:
  - title: IA aplicada
    description: Integración de LLMs con Gemini y Vertex AI, extracción de datos de documentos, automatización de procesos y agentes de IA — con revisión humana donde importa.
  - title: Desarrollo full-stack
    description: Plataformas web de punta a punta — APIs REST, backends escalables en Python y Node.js, y frontends en React.
  - title: Cloud y DevOps
    description: Microservicios en contenedores sobre Google Cloud con Docker y Kubernetes, y CI/CD para web y móvil — builds, firmado y publicación automática en App Store y Google Play con Codemagic.
  - title: Seguridad e ISO 27001
    description: Código seguro (OWASP), control de accesos y procesos de desarrollo alineados con auditorías ISO 27001.
  - title: Integraciones y datos
    description: Integraciones de APIs con sistemas de terceros y pipelines automatizados de web scraping para inteligencia de negocio.
